name: Verify source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r app/requirements.txt
      - run: python tools/check.py -v
        env:
          PYTHONPATH: app
          OPENBLAS_NUM_THREADS: '1'
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: waveguard-studio/package-lock.json
      - run: |
          find app/web -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm ci
        working-directory: waveguard-studio
      - run: npm run build
        working-directory: waveguard-studio
